<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revente">
<title>Revente</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/icon.svg" alt="" width="72" height="72">
    <h1>Revente</h1>
    <p class="muted">Entre le mot de passe pour continuer</p>
    <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="btn primary wide" type="submit">Se connecter</button>
    <p class="error" id="login-error"></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <nav class="sidebar" id="nav">
    <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span id="shop-name">Revente</span></div>
    <a href="#/" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Accueil</span></a>
    <a href="#/messages" data-view="messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Messages</span><b class="badge" id="badge-messages" hidden></b></a>
    <a href="#/stock" data-view="stock"><svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7zM4 7l8 4 8-4M12 11v10"/></svg><span>Stock</span></a>
    <a href="#/ventes" data-view="sales"><svg viewBox="0 0 24 24"><path d="M3 7h13v10H3zM16 10h3l2 3v4h-5M7 20a2 2 0 1 0 0-.1M18 20a2 2 0 1 0 0-.1"/></svg><span>À expédier</span><b class="badge" id="badge-sales" hidden></b></a>
    <a href="#/reglages" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Réglages</span></a>
  </nav>
  <main id="view" class="view"></main>
</div>

<div id="sheet" class="sheet-backdrop" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
